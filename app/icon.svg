<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">SA wedding monogram</title>
  <desc id="description">Gold S and ivory A monogram on a traditional maroon wedding emblem</desc>

  <defs>
    <radialGradient id="background" cx="42%" cy="34%" r="78%">
      <stop offset="0" stop-color="#8b3b32"/>
      <stop offset="1" stop-color="#4b1716"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3df9a"/>
      <stop offset="0.48" stop-color="#c99a3d"/>
      <stop offset="1" stop-color="#f6e7ac"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#background)"/>
  <rect x="27" y="27" width="458" height="458" rx="92" fill="none" stroke="url(#gold)" stroke-width="10"/>
  <rect x="43" y="43" width="426" height="426" rx="78" fill="none" stroke="#f8edc9" stroke-opacity="0.45" stroke-width="2"/>

  <path d="M168 108c30-22 61-22 88 0 27-22 58-22 88 0-26 3-47 15-62 36-9-10-17-17-26-22-9 5-17 12-26 22-15-21-36-33-62-36Z" fill="url(#gold)" opacity="0.9"/>

  <text x="87" y="352" fill="url(#gold)" font-family="Georgia, 'Times New Roman', serif" font-size="270" font-style="italic" font-weight="700">S</text>
  <text x="245" y="352" fill="#fff7df" font-family="Georgia, 'Times New Roman', serif" font-size="251" font-weight="700">A</text>

  <path d="M128 391c77 28 179 28 256 0" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="256" cy="405" r="7" fill="#fff7df"/>
